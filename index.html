<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111a2d"
  >

  <title>
    WindsorKnot | KNOT PASS
  </title>

  <!-- LINE LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    /* =====================================================
       DESIGN TOKENS
    ===================================================== */

    :root {

      --navy:
        #111a2d;

      --navy-deep:
        #0b1220;

      --navy-soft:
        #172238;

      --gold:
        #c6a15b;

      --gold-light:
        #ddc58f;

      --ivory:
        #f4f0e7;

      --danger:
        #e0aaa0;

      --serif:
        "Times New Roman",
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Arial,
        sans-serif;

    }


    /* =====================================================
       RESET
    ===================================================== */

    * {

      box-sizing:
        border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      margin: 0;

      padding: 0;

      min-height:
        100%;

      background:
        var(--navy);

    }


    body {

      margin: 0;

      min-height:
        100vh;

      min-height:
        100dvh;

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(198,161,91,.09),
          transparent 34%
        ),

        linear-gradient(
          180deg,
          #141e33 0%,
          #111a2d 46%,
          #0c1424 100%
        );

      color:
        var(--ivory);

      font-family:
        var(--sans);

      -webkit-font-smoothing:
        antialiased;

    }


    button,
    input {

      font-family:
        inherit;

    }


    body::before {

      content: "";

      position:
        fixed;

      z-index: 0;

      width:
        460px;

      height:
        460px;

      top:
        -270px;

      right:
        -270px;

      border:
        1px solid
        rgba(198,161,91,.10);

      border-radius:
        50%;

      pointer-events:
        none;

    }


    body::after {

      content: "";

      position:
        fixed;

      z-index: 0;

      width:
        330px;

      height:
        330px;

      bottom:
        -230px;

      left:
        -220px;

      border:
        1px solid
        rgba(198,161,91,.07);

      border-radius:
        50%;

      pointer-events:
        none;

    }


    /* =====================================================
       PAGE
    ===================================================== */

    .page {

      position:
        relative;

      z-index: 1;

      width:
        100%;

      min-height:
        100vh;

      min-height:
        100dvh;

    }


    .container {

      width:
        100%;

      max-width:
        480px;

      margin:
        0 auto;

      padding:

        calc(
          26px +
          env(safe-area-inset-top)
        )

        20px

        calc(
          55px +
          env(safe-area-inset-bottom)
        );

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .brand {

      text-align:
        center;

      padding-top:
        15px;

      margin-bottom:
        30px;

    }


    .brand-logo {

      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size:
        clamp(
          38px,
          10vw,
          49px
        );

      font-weight:
        400;

      font-style:
        italic;

      letter-spacing:
        -2.5px;

      line-height:
        1;

    }


    .brand-sub {

      margin-top:
        13px;

      color:
        var(--gold-light);

      font-family:
        var(--serif);

      font-size:
        10px;

      letter-spacing:
        5px;

      opacity:
        .88;

    }


    .brand-line {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        180px;

      margin:
        21px auto 0;

    }


    .brand-line::before,
    .brand-line::after {

      content: "";

      display:
        block;

      flex:
        1;

      height:
        1px;

    }


    .brand-line::before {

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(198,161,91,.72)
        );

    }


    .brand-line::after {

      background:
        linear-gradient(
          90deg,
          rgba(198,161,91,.72),
          transparent
        );

    }


    .brand-diamond {

      width:
        5px;

      height:
        5px;

      margin:
        0 11px;

      border:
        1px solid
        var(--gold);

      transform:
        rotate(45deg);

    }


    /* =====================================================
       PANEL
    ===================================================== */

    .panel {

      position:
        relative;

      overflow:
        hidden;

      border:
        1px solid
        rgba(198,161,91,.22);

      border-radius:
        4px;

      padding:
        34px 27px;

      background:

        linear-gradient(
          145deg,
          rgba(23,34,56,.96),
          rgba(10,18,32,.98)
        );

      box-shadow:

        0 28px 65px
        rgba(0,0,0,.24);

    }


    .eyebrow {

      color:
        var(--gold);

      font-family:
        var(--serif);

      font-size:
        10px;

      letter-spacing:
        3.5px;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading {

      padding:
        32px 5px 27px;

      text-align:
        center;

    }


    .loading-mark {

      position:
        relative;

      width:
        54px;

      height:
        54px;

      margin:
        0 auto 30px;

    }


    .loading-mark::before {

      content: "";

      position:
        absolute;

      inset:
        0;

      border:
        1px solid
        rgba(198,161,91,.18);

      border-radius:
        50%;

    }


    .spinner {

      position:
        absolute;

      top:
        6px;

      left:
        6px;

      width:
        42px;

      height:
        42px;

      border:
        1px solid
        rgba(198,161,91,.15);

      border-top-color:
        var(--gold);

      border-radius:
        50%;

      animation:
        spin 1.2s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    .loading-center {

      position:
        absolute;

      top:
        50%;

      left:
        50%;

      width:
        5px;

      height:
        5px;

      margin:
        -2.5px 0 0 -2.5px;

      background:
        var(--gold);

      transform:
        rotate(45deg);

    }


    .loading-title {

      margin-bottom:
        12px;

      font-family:
        var(--serif);

      font-size:
        19px;

      letter-spacing:
        1px;

    }


    .loading-text {

      color:
        rgba(244,240,231,.48);

      font-size:
        12px;

      line-height:
        1.9;

    }


    /* =====================================================
       FORM
    ===================================================== */

    .auth-head {

      margin-bottom:
        31px;

    }


    .auth-title {

      margin:
        8px 0 10px;

      font-family:
        var(--serif);

      font-size:
        27px;

      font-weight:
        400;

      letter-spacing:
        1px;

    }


    .auth-description {

      margin:
        0;

      color:
        rgba(244,240,231,.52);

      font-size:
        12px;

      line-height:
        1.9;

    }


    .field {

      margin-bottom:
        22px;

    }


    .label {

      display:
        block;

      margin-bottom:

        rgba(221,197,143,.82);

      font-size:
        9px;

      letter-spacing:

    }


    input {

        100%;

      height:

        1px solid

      border-radius:
        2px;

      padding:

      background:
        rgba(255,255,255,.035);

      color:

      font-size:

      outline:

    }


    input::placeholder {

    }

      border-color:

       BUTTONS
    ===================================================== */

    .primary-button {

        100%;

      min-height:

      border:
        1px solid

      border-radius:
        2px;

      padding:
        12px 15px;

      background:
        var(--gold);

      color:
        var(--navy-deep);

      font-family:
        var(--serif);

      font-size:
        13px;

      font-weight:
        600;

      letter-spacing:
        2px;

      cursor:

    }


    .primary-button:disabled {

    .secondary-button {

        100%;

      border:
        1px solid
        rgba(198,161,91,.38);

      border-radius:
        2px;

      padding:
        12px;

      background:
        transparent;

      color:
        var(--gold-light);

      font-family:
        var(--serif);

      font-size:
        12px;

      letter-spacing:
        2px;

      cursor:
        pointer;

    }


    .error {

      display:
        none;

      margin-top:
        20px;

      padding:
        15px 16px;

      border:
        1px solid
        rgba(193,112,91,.32);

      background:
        rgba(121,47,35,.13);

      color:
        var(--danger);

      font-size:
        12px;

      line-height:
        1.8;

    }


    /* =====================================================
       MEMBER CARD
    ===================================================== */

    .member-intro {

      margin-bottom:
        16px;

      text-align:
        center;

    }


    .member-intro-label {

      color:
        rgba(221,197,143,.65);

      font-size:
        8px;

      letter-spacing:
        4px;

    }


    .card {

      position:
        relative;

      overflow:
        hidden;

      width:
        100%;

      min-height:
        570px;

      border:
        1px solid
        rgba(198,161,91,.52);

      border-radius:
        5px;

      padding:
        32px 28px 30px;

      background:

        linear-gradient(
          145deg,
          #162138 0%,
          #111a2d 48%,
          #0b1322 100%
        );

      box-shadow:

        0 35px 75px
        rgba(0,0,0,.30);

    }


    .card::before {

      content: "";

      position:
        absolute;

      inset:
        7px;

      border:
        1px solid
        rgba(198,161,91,.11);

      pointer-events:
        none;

    }


    .card-monogram {

      position:
        absolute;

      right:
        -20px;

      bottom:
        -45px;

      color:
        rgba(198,161,91,.035);

      font-family:
        var(--serif);

      font-size:
        280px;

      font-style:
        italic;

      line-height:
        1;

      user-select:
        none;

    }


    .card-circle {

      position:
        absolute;

      width:
        290px;

      height:
        290px;

      right:
        -195px;

      bottom:
        -120px;

      border:
        1px solid
        rgba(198,161,91,.16);

      border-radius:
        50%;

    }


    .card-top,
    .identity,
    .card-grid,
    .card-footer {

      position:
        relative;

      z-index:
        2;

    }


    .card-logo {

      font-family:
        var(--serif);

      font-size:
        28px;

      font-style:
        italic;

      letter-spacing:
        -1.5px;

    }


    .card-pass {

      margin-top:
        8px;

      color:
        var(--gold-light);

      font-size:
        8px;

      letter-spacing:
        4px;

    }


    .card-ornament {

      display:
        flex;

      align-items:
        center;

      margin-top:
        23px;

    }


    .card-ornament-line {

      flex:
        1;

      height:
        1px;

      background:

        linear-gradient(
          90deg,
          rgba(198,161,91,.48),
          rgba(198,161,91,.06)
        );

    }


    .card-ornament-diamond {

      width:
        5px;

      height:
        5px;

      margin-left:
        8px;

      border:
        1px solid
        rgba(198,161,91,.72);

      transform:
        rotate(45deg);

    }


    .identity {

      margin-top:
        70px;

    }


    .member-label {

      color:
        rgba(221,197,143,.57);

      font-size:
        8px;

      letter-spacing:
        4px;

    }


    .member-name {

      margin-top:
        10px;

      font-family:
        var(--serif);

      font-size:
        clamp(
          27px,
          8vw,
          34px
        );

      letter-spacing:
        2px;

      line-height:
        1.35;

    }


    .organization {

      min-height:
        42px;

      margin-top:
        13px;

      color:
        rgba(244,240,231,.55);

      font-size:
        11px;

      line-height:
        1.75;

    }


    .divider {

      position:
        relative;

      z-index:
        2;

      height:
        1px;

      margin:
        33px 0 27px;

      background:

        linear-gradient(
          90deg,
          rgba(198,161,91,.50),
          rgba(198,161,91,.08)
        );

    }


    .card-grid {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        28px 18px;

    }


    .data-label {

      margin-bottom:
        9px;

      color:
        rgba(221,197,143,.48);

      font-size:
        7.5px;

      letter-spacing:
        2.5px;

    }


    .data-value {

      font-family:
        var(--serif);

      font-size:
        18px;

      letter-spacing:
        1px;

    }


    .visits-block {

      grid-column:
        1 / -1;

    }


    .visits {

      font-family:
        var(--serif);

      font-size:
        48px;

      line-height:
        1;

      letter-spacing:
        2px;

    }


    .card-footer {

      position:
        absolute;

      left:
        28px;

      right:
        28px;

      bottom:
        27px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

    }


    .card-footer-text {

      color:
        rgba(221,197,143,.40);

      font-size:
        7px;

      letter-spacing:
        3px;

    }


    .card-footer-mark {

      width:
        18px;

      height:
        18px;

      border:
        1px solid
        rgba(198,161,91,.35);

      border-radius:
        50%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .card-footer-mark::after {

      content: "";

      width:
        4px;

      height:
        4px;

      border:
        1px solid
        rgba(198,161,91,.7);

      transform:
        rotate(45deg);

    }


    /* =====================================================
       MEMBER MENU
    ===================================================== */

    .member-menu-area {

      margin-top:
        31px;

      padding:
        27px 23px;

      border:
        1px solid
        rgba(198,161,91,.20);

      background:
        rgba(255,255,255,.025);

      text-align:
        center;

    }


    .menu-eyebrow {

      color:
        var(--gold);

      font-size:
        8px;

      letter-spacing:
        3.5px;

    }


    .menu-title {

      margin-top:
        10px;

      font-family:
        var(--serif);

      font-size:
        21px;

      letter-spacing:
        1px;

    }


    .menu-description {

      margin:
        12px 0 21px;

      color:
        rgba(244,240,231,.48);

      font-size:
        10px;

      line-height:
        1.9;

    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal-overlay {

      display:
        none;

      position:
        fixed;

      z-index:
        9999;

      inset:
        0;

      align-items:
        center;

      justify-content:
        center;

      padding:
        24px;

      background:
        rgba(5,10,18,.82);

      backdrop-filter:
        blur(7px);

    }


    .modal-overlay.open {

      display:
        flex;

    }


    .modal {

      width:
        100%;

      max-width:
        410px;

      padding:
        33px 26px;

      border:
        1px solid
        rgba(198,161,91,.40);

      background:

        linear-gradient(
          145deg,
          #172238,
          #0c1424
        );

      box-shadow:

        0 35px 90px
        rgba(0,0,0,.45);

    }


    .modal-title {

      margin-top:
        9px;

      font-family:
        var(--serif);

      font-size:
        23px;

      line-height:
        1.5;

    }


    .modal-text {

      margin:
        15px 0 25px;

      color:
        rgba(244,240,231,.52);

      font-size:
        11px;

      line-height:
        1.9;

    }


    .modal-member {

      margin-bottom:
        24px;

      padding:
        16px;

      border-top:
        1px solid
        rgba(198,161,91,.20);

      border-bottom:
        1px solid
        rgba(198,161,91,.20);

    }


    .modal-member-name {

      font-family:
        var(--serif);

      font-size:
        18px;

    }


    .modal-member-no {

      margin-top:
        6px;

      color:
        rgba(221,197,143,.55);

      font-size:
        9px;

      letter-spacing:
        2px;

    }


    .modal-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

    }


    /* =====================================================
       SUCCESS
    ===================================================== */

    .success-panel {

      text-align:
        center;

      padding:
        42px 27px;

    }


    .success-mark {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        64px;

      height:

      margin:

    ===================================================== */

  </style>

</head>


<body>


<div class="page">


  <div class="container">


    <!-- HEADER -->

    <header class="brand">


      <div class="brand-logo">

        WindsorKnot

      </div>


      <div class="brand-sub">

        KNOT PASS

      </div>


      <div class="brand-line">

        <div
          class="brand-diamond"
        ></div>

      </div>


    </header>


    <!-- APPLICATION -->

    <main id="app">


      <div class="panel">


        <div class="loading">


          <div class="loading-mark">

            <div
              class="spinner"
            ></div>

            <div
              class="loading-center"
            ></div>

          </div>


          <div class="loading-title">

            Membership Verification

          </div>


          <div class="loading-text">

            LINEアカウントと
            会員情報を確認しています。

          </div>


        </div>


      </div>


    </main>


  </div>


</div>



<!-- =====================================================
     CONFIRM MODAL
===================================================== -->

<div
  id="confirmModal"
  class="modal-overlay"
>


  <div class="modal">


    <div class="eyebrow">

      MEMBER MENU

    </div>


    <div class="modal-title">

      会員メニューを
      <br>
      利用しますか？

    </div>


    <div class="modal-text">

      「利用する」を押すと、
      本日の会員メニュー利用として
      記録されます。

    </div>


    <div class="modal-member">


      <div
        id="modalMemberName"
        class="modal-member-name"
      ></div>


      <div
        id="modalMemberNo"
        class="modal-member-no"
      ></div>


    </div>


    <div class="modal-buttons">


      <button
        type="button"
        class="secondary-button"
        onclick="closeUseConfirm()"
      >

        キャンセル

      </button>


      <button
        id="confirmUseButton"
        type="button"
        class="primary-button"
        onclick="registerMenuUse()"
      >

        利用する

      </button>


    </div>


    <div
      id="useError"
      class="error"
    ></div>


  </div>


</div>



<script>


/* =====================================================
   CONFIG
===================================================== */


/**
 * LIFF ID
 */
const LIFF_ID =
  '2011750249-fEwnWrPD';


/**
 * GAS Web App URL
 *
 * 現在利用しているURLを維持
 */
const API_URL =
  'https://script.google.com/macros/s/AKfycbzxcn3Esc_HHA_N13EDRoSeX4ItMobH6eaQ_874g1AV_I0CU6LUaczHbnP_6mDzf6mNCw/exec';



/* =====================================================
   STATE
===================================================== */


let currentLineUserId =
  '';


let currentMember =
  null;


let isRegistering =
  false;



/* =====================================================
   INITIALIZE
===================================================== */


window.addEventListener(
  'load',
  initialize
);


async function initialize() {


  try {


    /**
     * LIFF初期化
     */
    await liff.init({

      liffId:
        LIFF_ID

    });


    /**
     * LINEログイン
     */
    if (
      !liff.isLoggedIn()
    ) {


      liff.login();


      return;

    }


    /**
     * LINEプロフィール取得
     */
    const profile =
      await liff.getProfile();


    currentLineUserId =
      profile.userId;


    if (
      !currentLineUserId
    ) {


      throw new Error(
        'LINE User IDを取得できませんでした。'
      );

    }


    /**
     * 会員検索
     */
    await checkMember();


  } catch (error) {


    console.error(
      'INITIALIZE ERROR',
      error
    );


    showFatalError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   MEMBER SEARCH
===================================================== */


async function checkMember() {


  try {


    showLoading(
      'Membership Verification'
    );


    const url =

      API_URL +

      '?action=getMember' +

      '&lineUserId=' +

      encodeURIComponent(
        currentLineUserId
      );


    const response =
      await fetch(
        url,
        {
          cache:
            'no-store'
        }
      );


    if (
      !response.ok
    ) {


      throw new Error(
        '会員情報の取得に失敗しました。'
      );

    }


    const data =
      await response.json();


    /**
     * 会員発見
     */
    if (
      data.success &&
      (
        data.status ===
          'MEMBER_FOUND' ||

        data.status ===
          'ALREADY_LINKED'
      )
    ) {


      currentMember =
        data.member;


      showMemberCard(
        data.member
      );


      return;

    }


    /**
     * LINE未連携
     */
    if (
      data.status ===
      'MEMBER_NOT_LINKED'
    ) {


      showLinkForm();


      return;

    }


    throw new Error(

      data.message ||

      '会員情報を確認できませんでした。'

    );


  } catch (error) {


    console.error(
      'MEMBER SEARCH ERROR',
      error
    );


    showFatalError(

      error.message ||

      String(error)

    );

  }

}



/* =====================================================
   LINK FORM
===================================================== */


function showLinkForm() {


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <div class="panel">


        <div class="auth-head">


          <div class="eyebrow">

            MEMBER AUTHENTICATION

          </div>


          <h2 class="auth-title">

            KNOT PASS

          </h2>


          <p class="auth-description">

            初回のみ会員情報の
            確認が必要です。

            <br>

            ご登録済みの会員番号と
            電話番号を入力してください。

          </p>


        </div>


        <div class="field">


          <label
            class="label"
            for="memberNo"
          >

            MEMBER No.

          </label>


          <input
            id="memberNo"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="会員番号"
          >


        </div>


        <div class="field">


          <label
            class="label"
            for="phone"
          >

            PHONE NUMBER

          </label>


          <input
            id="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="08012345678"
          >


        </div>


        <button
          id="linkButton"
          type="button"
          class="primary-button"
          onclick="linkMember()"
        >

          VIEW KNOT PASS

        </button>


        <div
          id="formError"
          class="error"
        ></div>


      </div>


      <div class="venue-line">

        BAR ・ RESTAURANT ・ PARTY

      </div>


      <div class="notice">

        入力情報は
        会員本人確認のためにのみ
        使用します。

      </div>

  `;

}



/* =====================================================
   LINK MEMBER
===================================================== */


async function linkMember() {


  const memberNo =

    document
      .getElementById(
        'memberNo'
      )
      .value
      .trim();


  const phone =

    document
      .getElementById(
        'phone'
      )
      .value
      .trim();


  const button =

    document
      .getElementById(
        'linkButton'
      );


  const errorBox =

    document
      .getElementById(
        'formError'
      );


  errorBox.style.display =
    'none';


  if (
    !memberNo
  ) {


    showFormError(
      '会員番号を入力してください。'
    );


    return;

  }


  if (
    !phone
  ) {


    showFormError(
      '電話番号を入力してください。'
    );


    return;

  }


  button.disabled =
    true;


  button.textContent =
    'VERIFYING...';


  try {


    const response =

      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:

            JSON.stringify({

              action:
                'linkMember',

              memberNo:
                memberNo,

              phone:
                phone,

              lineUserId:
                currentLineUserId

            })

        }

      );


    const data =
      await response.json();


    if (
      data.success &&
      (
        data.status ===
          'LINK_SUCCESS' ||

        data.status ===
          'ALREADY_LINKED'
      )
    ) {


      currentMember =
        data.member;


      showMemberCard(
        data.member
      );


      return;

    }


    showFormError(

      data.message ||

      '会員情報を確認できませんでした。'

    );


  } catch (error) {


    console.error(
      'LINK ERROR',
      error
    );


    showFormError(
      '通信エラーが発生しました。もう一度お試しください。'
    );


  } finally {


    const currentButton =

      document
        .getElementById(
          'linkButton'
        );


    if (
      currentButton
    ) {


      currentButton.disabled =
        false;


      currentButton.textContent =
        'VIEW KNOT PASS';

    }

  }

}



/* =====================================================
   MEMBER CARD
===================================================== */


function showMemberCard(
  member
) {


  currentMember =
    member;


  const memberNo =

    escapeHtml(
      member.memberNo ||
      ''
    );


  const name =

    escapeHtml(
      member.name ||
      ''
    );


  const organization =

    escapeHtml(
      member.organization ||
      ''
    );


  const joinMonth =

    escapeHtml(

      formatJoinMonth(
        member.joinMonth
      )

    );


  const visits =

    Number(
      member.visits ||
      0
    );


  const formattedVisits =

    String(
      visits
    ).padStart(
      2,
      '0'
    );


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <section>


        <div class="member-intro">


          <div class="member-intro-label">

            MEMBERSHIP

          </div>


        </div>


        <div class="card">


          <div
            class="card-monogram"
            aria-hidden="true"
          >

            K

          </div>


          <div
            class="card-circle"
            aria-hidden="true"
          ></div>


          <div class="card-top">


            <div class="card-logo">

              WindsorKnot

            </div>


            <div class="card-pass">

              KNOT PASS

            </div>


            <div class="card-ornament">


              <div
                class="card-ornament-line"
              ></div>


              <div
                class="card-ornament-diamond"
              ></div>


            </div>


          </div>


          <div class="identity">


            <div class="member-label">

              MEMBER

            </div>


            <div class="member-name">

              ${name}

            </div>


            <div class="organization">

              ${organization}

            </div>


          </div>


          <div class="divider"></div>


          <div class="card-grid">


            <div>


              <div class="data-label">

                MEMBER No.

              </div>


              <div class="data-value">

                ${memberNo}

              </div>


            </div>


            <div>


              <div class="data-label">

                MEMBER SINCE

              </div>


              <div class="data-value">

                ${joinMonth}

              </div>


            </div>


            <div class="visits-block">


              <div class="data-label">

                TOTAL VISITS

              </div>


              <div class="visits">

                ${formattedVisits}

              </div>


            </div>


          </div>


          <div class="card-footer">


            <div class="card-footer-text">

              KNOT PASS MEMBER

            </div>


            <div
              class="card-footer-mark"
            ></div>


          </div>


        </div>



        <!-- =========================================
             MEMBER MENU BUTTON
        ========================================== -->


        <div class="member-menu-area">


          <div class="menu-eyebrow">

            MEMBER BENEFIT

          </div>


          <div class="menu-title">

            会員メニュー

          </div>


          <div class="menu-description">

            会員メニューをご利用の際に
            <br>
            スタッフの案内に従って
            ボタンを押してください。

          </div>


          <button
            type="button"
            class="primary-button"
            onclick="openUseConfirm()"
          >

            会員メニューを利用する

          </button>


        </div>


        <div class="venue-line">

          BAR ・ RESTAURANT ・ PARTY

        </div>


        <div class="notice">

          この画面は
          会員本人のみご利用いただけます。

        </div>


      </section>

  `;

}



/* =====================================================
   OPEN CONFIRM
===================================================== */


function openUseConfirm() {


  if (
    !currentMember
  ) {


    return;

  }


  document
    .getElementById(
      'modalMemberName'
    )
    .textContent =

      currentMember.name ||
      '';


  document
    .getElementById(
      'modalMemberNo'
    )
    .textContent =

      'MEMBER No. ' +

      (
        currentMember.memberNo ||
        ''
      );


  const errorBox =

    document
      .getElementById(
        'useError'
      );


  errorBox.style.display =
    'none';


  document
    .getElementById(
      'confirmModal'
    )
    .classList
    .add(
      'open'
    );

}



/* =====================================================
   CLOSE CONFIRM
===================================================== */


function closeUseConfirm() {


  if (
    isRegistering
  ) {


    return;

  }


  document
    .getElementById(
      'confirmModal'
    )
    .classList
    .remove(
      'open'
    );

}



/* =====================================================
   REGISTER MENU USE
===================================================== */


async function registerMenuUse() {


  /**
   * 二重タップ防止
   */
  if (
    isRegistering
  ) {


    return;

  }


  isRegistering =
    true;


  const button =

    document
      .getElementById(
        'confirmUseButton'
      );


  const errorBox =

    document
      .getElementById(
        'useError'
      );


  button.disabled =
    true;


  button.textContent =
    '登録中...';


  errorBox.style.display =
    'none';


  try {


    /**
     * GASへ送信
     *
     * 会員No.や氏名は送らず、
     * LINE User IDだけを送信。
     *
     * GAS側で本人を再照合する。
     */
    const response =

      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:

            JSON.stringify({

              action:
                'useMemberMenu',

              lineUserId:
                currentLineUserId

            })

        }

      );


    if (
      !response.ok
    ) {


      throw new Error(
        '利用登録に失敗しました。'
      );

    }


    const data =
      await response.json();


    if (
      !data.success ||
      data.status !==
        'MENU_USE_REGISTERED'
    ) {


      throw new Error(

        data.message ||

        '利用登録に失敗しました。'

      );

    }


    /**
     * 最新会員情報
     */
    if (
      data.member
    ) {


      currentMember =
        data.member;

    }


    /**
     * モーダルを閉じる
     */
    document
      .getElementById(
        'confirmModal'
      )
      .classList
      .remove(
        'open'
      );


    /**
     * 完了画面
     */
    showUseSuccess(
      data.member
    );


  } catch (error) {


    console.error(
      'MENU USE ERROR',
      error
    );


    errorBox.textContent =

      error.message ||

      '通信エラーが発生しました。';


    errorBox.style.display =
      'block';


    isRegistering =
      false;


    button.disabled =
      false;


    button.textContent =
      '利用する';

  }

}



/* =====================================================
   SUCCESS SCREEN
===================================================== */


function showUseSuccess(
  member
) {


  const today =
    formatToday();


  const memberNo =

    member &&
    member.memberNo

      ? escapeHtml(
          member.memberNo
        )

      : '';


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <div
        class="
          panel
          success-panel
        "
      >


        <div class="success-mark">

          ✓

        </div>


        <div class="eyebrow">

          MEMBER MENU

        </div>


        <div class="success-title">

          利用を記録しました

        </div>


        <div class="success-date">

          ${today}

          <br>

          MEMBER No.
          ${memberNo}

        </div>


        <div class="success-text">

          会員メニューの利用登録が
          完了しました。

          <br>

          ご利用ありがとうございます。

        </div>


        <div
          style="
            margin-top:30px;
          "
        >


          <button
            type="button"
            class="secondary-button"
            onclick="reloadMemberCard()"
          >

            会員証に戻る

          </button>


        </div>


      </div>


      <div class="venue-line">

        WINDSOR KNOT

      </div>

  `;

}



/* =====================================================
   RELOAD MEMBER CARD
===================================================== */


async function reloadMemberCard() {


  /**
   * 状態を解除
   */
  isRegistering =
    false;


  /**
   * GASから最新情報を再取得
   *
   * 会員名簿H列が
   * 精算管理台帳をCOUNTしている場合、
   * TOTAL VISITSもここで更新される。
   */
  await checkMember();

}



/* =====================================================
   LOADING
===================================================== */


function showLoading(
  message
) {


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <div class="panel">


        <div class="loading">


          <div class="loading-mark">


            <div
              class="spinner"
            ></div>


            <div
              class="loading-center"
            ></div>


          </div>


          <div class="loading-title">

            ${escapeHtml(message)}

          </div>


          <div class="loading-text">

            LINEアカウントと
            会員情報を確認しています。

            <br>

            しばらくお待ちください。

          </div>


        </div>


      </div>

  `;

}



/* =====================================================
   FORM ERROR
===================================================== */


function showFormError(
  message
) {


  const box =

    document
      .getElementById(
        'formError'
      );


  if (
    !box
  ) {


    return;

  }


  box.textContent =
    message;


  box.style.display =
    'block';

}



/* =====================================================
   FATAL ERROR
===================================================== */


function showFatalError(
  message
) {


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <div class="panel">


        <div class="eyebrow">

          CONNECTION ERROR

        </div>


        <h2 class="auth-title">

          KNOT PASS

        </h2>


        <p class="auth-description">

          会員情報を表示できませんでした。

          <br>

          通信環境をご確認のうえ、
          もう一度お試しください。

        </p>


        <div
          class="error"
          style="
            display:block;
          "
        >

          ${escapeHtml(message)}

        </div>


      </div>


      <div class="venue-line">

        WINDSOR KNOT

      </div>

  `;

}



/* =====================================================
   DATE
===================================================== */


function formatToday() {


  const date =
    new Date();


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() +
      1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );


  return (
    year +
    '.' +
    month +
    '.' +
    day
  );

}



/* =====================================================
   JOIN MONTH
===================================================== */


function formatJoinMonth(
  value
) {


  if (
    !value
  ) {


    return '-';

  }


  const text =
    String(
      value
    ).trim();


  /**
   * 2026年9月
   * →
   * 2026.09
   */
  const japaneseMatch =

    text.match(
      /(\d{4})年\s*(\d{1,2})月/
    );


  if (
    japaneseMatch
  ) {


    return (

      japaneseMatch[1] +

      '.' +

      String(
        japaneseMatch[2]
      ).padStart(
        2,
        '0'
      )

    );

  }


  /**
   * ISO形式
   */
  const isoMatch =

    text.match(
      /^(\d{4})-(\d{1,2})/
    );


  if (
    isoMatch
  ) {


    return (

      isoMatch[1] +

      '.' +

      String(
        isoMatch[2]
      ).padStart(
        2,
        '0'
      )

    );

  }


  return text;

}



/* =====================================================
   ESCAPE HTML
===================================================== */


function escapeHtml(
  value
) {


  return String(

    value == null

      ? ''

      : value

  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

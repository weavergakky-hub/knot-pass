<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111a2d">

  <title>WindsorKnot | KNOT PASS</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!--
    WindsorKnot KNOT PASS
    ------------------------------------
    LIFF / GAS の通信ロジックは既存仕様を維持。
    UIのみ WindsorKnot ブランドに合わせて再設計。
  -->

  <style>

    /* =========================================================
       01. DESIGN TOKENS
    ========================================================= */

    :root {
      --navy: #111a2d;
      --navy-deep: #0b1220;
      --navy-soft: #172238;

      --gold: #c6a15b;
      --gold-light: #ddc58f;
      --gold-dark: #8f713b;

      --ivory: #f4f0e7;
      --ivory-soft: #ebe5d8;

      --white: #ffffff;
      --black: #111111;

      --muted: rgba(244, 240, 231, 0.56);
      --line: rgba(198, 161, 91, 0.28);

      --serif:
        "Times New Roman",
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        serif;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Arial,
        sans-serif;
    }


    /* =========================================================
       02. RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--navy);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(198, 161, 91, 0.09),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #141e33 0%,
          #111a2d 46%,
          #0c1424 100%
        );

      color: var(--ivory);
      font-family: var(--sans);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font-family: inherit;
    }


    /* =========================================================
       03. BACKGROUND DECORATION
    ========================================================= */

    body::before {
      content: "";
      position: fixed;
      z-index: 0;

      width: 460px;
      height: 460px;

      top: -270px;
      right: -270px;

      border: 1px solid rgba(198, 161, 91, 0.10);
      border-radius: 50%;

      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;

      width: 330px;
      height: 330px;

      bottom: -230px;
      left: -220px;

      border: 1px solid rgba(198, 161, 91, 0.07);
      border-radius: 50%;

      pointer-events: none;
    }


    /* =========================================================
       04. PAGE
    ========================================================= */

    .page {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .container {
      width: 100%;
      max-width: 480px;

      margin: 0 auto;

      padding:
        calc(26px + env(safe-area-inset-top))
        20px
        calc(55px + env(safe-area-inset-bottom));
    }


    /* =========================================================
       05. BRAND HEADER
    ========================================================= */

    .brand {
      text-align: center;

      padding-top: 15px;
      margin-bottom: 30px;
    }

    .brand-logo {
      color: var(--ivory);

      font-family: var(--serif);
      font-size: clamp(38px, 10vw, 49px);

      font-weight: 400;
      font-style: italic;

      letter-spacing: -2.5px;
      line-height: 1;

      text-shadow:
        0 0 30px rgba(198, 161, 91, 0.07);
    }

    .brand-sub {
      margin-top: 13px;

      color: var(--gold-light);

      font-family: var(--serif);
      font-size: 10px;

      letter-spacing: 5px;

      opacity: 0.88;
    }

    .brand-line {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 180px;

      margin: 21px auto 0;
    }

    .brand-line::before,
    .brand-line::after {
      content: "";

      display: block;
      flex: 1;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(198, 161, 91, 0.72)
        );
    }

    .brand-line::after {
      background:
        linear-gradient(
          90deg,
          rgba(198, 161, 91, 0.72),
          transparent
        );
    }

    .brand-diamond {
      width: 5px;
      height: 5px;

      margin: 0 11px;

      border: 1px solid var(--gold);
      transform: rotate(45deg);
    }


    /* =========================================================
       06. COMMON PANEL
    ========================================================= */

    .panel {
      position: relative;

      overflow: hidden;

      border: 1px solid rgba(198, 161, 91, 0.22);
      border-radius: 4px;

      padding: 34px 27px;

      background:
        linear-gradient(
          145deg,
          rgba(23, 34, 56, 0.96),
          rgba(10, 18, 32, 0.98)
        );

      box-shadow:
        0 28px 65px rgba(0, 0, 0, 0.24);
    }

    .panel::before {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      top: -100px;
      right: -100px;

      border: 1px solid rgba(198, 161, 91, 0.14);
      border-radius: 50%;
    }

    .eyebrow {
      color: var(--gold);

      font-family: var(--serif);
      font-size: 10px;

      letter-spacing: 3.5px;

      text-transform: uppercase;
    }


    /* =========================================================
       07. LOADING
    ========================================================= */

    .loading {
      padding: 32px 5px 27px;
      text-align: center;
    }

    .loading-mark {
      position: relative;

      width: 54px;
      height: 54px;

      margin: 0 auto 30px;
    }

    .loading-mark::before {
      content: "";

      position: absolute;
      inset: 0;

      border: 1px solid rgba(198, 161, 91, 0.18);
      border-radius: 50%;
    }

    .spinner {
      position: absolute;

      top: 6px;
      left: 6px;

      width: 42px;
      height: 42px;

      border:
        1px solid
        rgba(198, 161, 91, 0.15);

      border-top-color:
        var(--gold);

      border-radius: 50%;

      animation:
        spin 1.2s linear infinite;
    }

    .loading-mark-center {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 5px;
      height: 5px;

      margin:
        -2.5px 0 0 -2.5px;

      background:
        var(--gold);

      transform:
        rotate(45deg);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-title {
      margin-bottom: 12px;

      color: var(--ivory);

      font-family: var(--serif);
      font-size: 19px;

      font-weight: 400;

      letter-spacing: 1px;
    }

    .loading-text {
      color:
        rgba(244, 240, 231, 0.48);

      font-size: 12px;

      line-height: 1.9;
    }


    /* =========================================================
       08. LINK / AUTH FORM
    ========================================================= */

    .auth-head {
      margin-bottom: 31px;
    }

    .auth-title {
      margin:
        8px 0 10px;

      color: var(--ivory);

      font-family: var(--serif);
      font-size: 27px;

      font-weight: 400;

      letter-spacing: 1px;
    }

    .auth-description {
      margin: 0;

      color:
        rgba(244, 240, 231, 0.52);

      font-size: 12px;

      line-height: 1.9;
    }

    .field {
      margin-bottom: 22px;
    }

    .label {
      display: block;

      margin-bottom: 9px;

      color:
        rgba(221, 197, 143, 0.82);

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 2.4px;
    }

    input {
      width: 100%;
      height: 55px;

      border:
        1px solid
        rgba(198, 161, 91, 0.25);

      border-radius: 2px;

      padding: 0 16px;

      background:
        rgba(255, 255, 255, 0.035);

      color: var(--ivory);

      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s,
        background 0.2s;
    }

    input::placeholder {
      color:
        rgba(244, 240, 231, 0.24);
    }

    input:focus {
      border-color:
        rgba(198, 161, 91, 0.78);

      background:
        rgba(255, 255, 255, 0.055);
    }

    button {
      position: relative;

      width: 100%;
      height: 57px;

      margin-top: 8px;

      border:
        1px solid
        var(--gold);

      border-radius: 2px;

      background:
        var(--gold);

      color:
        var(--navy-deep);

      font-family:
        var(--serif);

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 2.5px;

      cursor: pointer;

      transition:
        opacity 0.2s,
        transform 0.15s;
    }

    button:active {
      transform:
        scale(0.99);
    }

    button:disabled {
      opacity: 0.48;
    }

    .error {
      display: none;

      margin-top: 20px;

      padding: 15px 16px;

      border:
        1px solid
        rgba(193, 112, 91, 0.32);

      border-radius: 2px;

      background:
        rgba(121, 47, 35, 0.13);

      color: #e0aaa0;

      font-size: 12px;

      line-height: 1.8;
    }


    /* =========================================================
       09. MEMBER CARD WRAPPER
    ========================================================= */

    .member-section {
      width: 100%;
    }

    .member-intro {
      margin-bottom: 16px;

      text-align: center;
    }

    .member-intro-label {
      color:
        rgba(221, 197, 143, 0.65);

      font-size: 8px;

      letter-spacing: 4px;
    }


    /* =========================================================
       10. MEMBER CARD
    ========================================================= */

    .card {
      position: relative;

      overflow: hidden;

      width: 100%;
      min-height: 570px;

      border:
        1px solid
        rgba(198, 161, 91, 0.52);

      border-radius: 5px;

      padding: 32px 28px 30px;

      background:
        linear-gradient(
          145deg,
          #162138 0%,
          #111a2d 48%,
          #0b1322 100%
        );

      color:
        var(--ivory);

      box-shadow:
        0 35px 75px
        rgba(0, 0, 0, 0.30);
    }


    /* subtle inner border */

    .card::before {
      content: "";

      position: absolute;

      inset: 7px;

      border:
        1px solid
        rgba(198, 161, 91, 0.11);

      border-radius: 2px;

      pointer-events: none;
    }


    /* giant decorative K */

    .card-monogram {
      position: absolute;

      z-index: 0;

      right: -20px;
      bottom: -45px;

      color:
        rgba(198, 161, 91, 0.035);

      font-family:
        var(--serif);

      font-size: 280px;
      font-style: italic;

      line-height: 1;

      pointer-events: none;
      user-select: none;
    }


    /* corner circle */

    .card-circle {
      position: absolute;

      z-index: 0;

      width: 290px;
      height: 290px;

      right: -195px;
      bottom: -120px;

      border:
        1px solid
        rgba(198, 161, 91, 0.16);

      border-radius: 50%;
    }


    /* =========================================================
       11. CARD TOP
    ========================================================= */

    .card-top {
      position: relative;
      z-index: 2;
    }

    .card-logo {
      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size: 28px;

      font-style: italic;

      letter-spacing: -1.5px;
    }

    .card-pass {
      margin-top: 8px;

      color:
        var(--gold-light);

      font-size: 8px;

      letter-spacing: 4px;
    }

    .card-ornament {
      display: flex;
      align-items: center;

      width: 100%;

      margin-top: 23px;
    }

    .card-ornament-line {
      flex: 1;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          rgba(198, 161, 91, 0.48),
          rgba(198, 161, 91, 0.06)
        );
    }

    .card-ornament-diamond {
      width: 5px;
      height: 5px;

      margin-left: 8px;

      border:
        1px solid
        rgba(198, 161, 91, 0.72);

      transform:
        rotate(45deg);
    }


    /* =========================================================
       12. MEMBER IDENTITY
    ========================================================= */

    .identity {
      position: relative;
      z-index: 2;

      margin-top: 70px;
    }

    .member-label {
      color:
        rgba(221, 197, 143, 0.57);

      font-size: 8px;

      letter-spacing: 4px;
    }

    .member-name {
      margin-top: 10px;

      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size:
        clamp(27px, 8vw, 34px);

      font-weight: 400;

      letter-spacing: 2px;

      line-height: 1.35;
    }

    .organization {
      min-height: 42px;

      margin-top: 13px;

      color:
        rgba(244, 240, 231, 0.55);

      font-size: 11px;

      line-height: 1.75;

      letter-spacing: 0.3px;
    }


    /* =========================================================
       13. DIVIDER
    ========================================================= */

    .divider {
      position: relative;
      z-index: 2;

      height: 1px;

      margin: 33px 0 27px;

      background:
        linear-gradient(
          90deg,
          rgba(198, 161, 91, 0.50),
          rgba(198, 161, 91, 0.08)
        );
    }


    /* =========================================================
       14. MEMBER DATA
    ========================================================= */

    .card-grid {
      position: relative;
      z-index: 2;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        28px 18px;
    }

    .data-block {
      min-width: 0;
    }

    .data-label {
      margin-bottom: 9px;

      color:
        rgba(221, 197, 143, 0.48);

      font-size: 7.5px;

      letter-spacing: 2.5px;
    }

    .data-value {
      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size: 18px;

      letter-spacing: 1px;

    .visits-block {
      grid-column: 1 / -1;

      margin-top: 1px;
    }

    .visits {
      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size: 48px;

      font-weight: 400;

      line-height: 1;

      letter-spacing: 2px;
    }


    /* =========================================================
       15. CARD FOOTER
    ========================================================= */

    .card-footer {
      position: absolute;

      z-index: 2;

      left: 28px;
      right: 28px;
      bottom: 27px;

      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .card-footer-text {
      color:
        rgba(221, 197, 143, 0.40);

      font-size: 7px;

      letter-spacing: 3px;
    }

    .card-footer-mark {
      width: 18px;
      height: 18px;

      border:
        1px solid
        rgba(198, 161, 91, 0.35);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-footer-mark::after {
      content: "";

      width: 4px;
      height: 4px;

      border:
        1px solid
        rgba(198, 161, 91, 0.7);

      transform:
        rotate(45deg);
    }


    /* =========================================================
       16. BELOW CARD
    ========================================================= */

    .venue-line {
      margin-top: 25px;

      text-align: center;

      color:
        rgba(221, 197, 143, 0.55);

      font-family:
        var(--serif);

      font-size: 9px;

      letter-spacing: 5px;
    }

    .notice {
      margin-top: 16px;

      text-align: center;

      color:
        rgba(244, 240, 231, 0.32);

      font-size: 9px;

      line-height: 1.8;

      letter-spacing: 0.5px;
    }


    /* =========================================================
       17. FATAL ERROR
    ========================================================= */

    .fatal-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 46px;
      height: 46px;

      margin-bottom: 25px;

      border:
        1px solid
        rgba(198, 161, 91, 0.45);

      border-radius: 50%;

      color:
        var(--gold);

      font-family:
        var(--serif);

      font-size: 20px;
    }


    /* =========================================================
       18. SMALL DEVICES
    ========================================================= */

    @media (max-width: 370px) {

      .container {
        padding-left: 15px;
        padding-right: 15px;
      }

      .card {
        min-height: 540px;

        padding-left: 23px;
        padding-right: 23px;
      }

      .identity {
        margin-top: 60px;
      }

      .member-name {
        font-size: 26px;
      }

      .card-footer {
        left: 23px;
        right: 23px;
      }

    }

  </style>
</head>


<body>

<div class="page">

  <div class="container">


    <!-- =======================================================
         BRAND HEADER
    ======================================================== -->

    <header class="brand">

      <div class="brand-logo">
        WindsorKnot
      </div>

      <div class="brand-sub">
        KNOT PASS
      </div>

      <div class="brand-line">

        <div class="brand-diamond"></div>

      </div>

    </header>


    <!-- =======================================================
         APPLICATION
    ======================================================== -->

    <main id="app">

      <div class="panel">

        <div class="loading">

          <div class="loading-mark">

            <div class="spinner"></div>

            <div
              class="loading-mark-center"
            ></div>

          </div>

          <div class="loading-title">
            Membership Verification
          </div>

          <div class="loading-text">
            LINEアカウントと会員情報を確認しています。
          </div>

        </div>

      </div>

    </main>


  </div>

</div>



<script>

/* =========================================================
   CONFIG
========================================================= */


/*
  発行済みLIFF ID
*/
const LIFF_ID =
  '2011750249-fEwnWrPD';


/*
  現在利用しているGAS Web App
  ※既存のURLをそのまま維持
*/
const API_URL =
  'https://script.google.com/macros/s/AKfycbzxcn3Esc_HHA_N13EDRoSeX4ItMobH6eaQ_874g1AV_I0CU6LUaczHbnP_6mDzf6mNCw/exec';


let currentLineUserId = '';



/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
  'load',
  initialize
);


async function initialize() {

  try {

    /*
      LIFF初期化
    */
    await liff.init({
      liffId: LIFF_ID
    });


    /*
      未ログインの場合はLINEログイン
    */
    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }


    /*
      LINEプロフィール取得
    */
    const profile =
      await liff.getProfile();


    currentLineUserId =
      profile.userId;


    if (!currentLineUserId) {

      throw new Error(
        'LINE User IDを取得できませんでした。'
      );

    }


    /*
      会員検索
    */
    await checkMember();


  } catch (error) {

    console.error(
      'LIFF INITIALIZE ERROR',
      error
    );

    showFatalError(
      error.message ||
      String(error)
    );

  }

}



/* =========================================================
   MEMBER SEARCH
========================================================= */

/**
 * LINE User IDで
 * 既存会員連携を検索
 */
async function checkMember() {

  try {

    showLoading(
      'Membership Verification'
    );


    const url =
      API_URL +
      '?action=getMember' +
      '&lineUserId=' +
      encodeURIComponent(
        currentLineUserId
      );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        '会員情報の取得に失敗しました。'
      );

    }


    const data =
      await response.json();


    /*
      既にLINE連携済み
    */
    if (
      data.success &&
      (
        data.status ===
          'MEMBER_FOUND' ||

        data.status ===
          'ALREADY_LINKED'
      )
    ) {

      showMemberCard(
        data.member
      );

      return;
    }


    /*
      会員だがLINE未連携
    */
    if (
      data.status ===
      'MEMBER_NOT_LINKED'
    ) {

      showLinkForm();

      return;
    }


    throw new Error(
      data.message ||
      '会員情報を確認できませんでした。'
    );


  } catch (error) {

    console.error(
      'MEMBER SEARCH ERROR',
      error
    );

    showFatalError(
      error.message ||
      String(error)
    );

  }

}



/* =========================================================
   FIRST LINK FORM
========================================================= */

/**
 * 初回連携フォーム
 */
function showLinkForm() {

  document
    .getElementById('app')
    .innerHTML = `

      <div class="panel">


        <div class="auth-head">

          <div class="eyebrow">
            MEMBER AUTHENTICATION
          </div>

          <h2 class="auth-title">
            KNOT PASS
          </h2>

          <p class="auth-description">
            初回のみ会員情報の確認が必要です。
            <br>
            ご登録済みの会員番号と電話番号を
            入力してください。
          </p>

        </div>


        <div class="field">

          <label
            class="label"
            for="memberNo"
          >
            MEMBER No.
          </label>

          <input
            id="memberNo"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="会員番号"
          >

        </div>


        <div class="field">

          <label
            class="label"
            for="phone"
          >
            PHONE NUMBER
          </label>

          <input
            id="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="08012345678"
          >

        </div>


        <button
          id="linkButton"
          type="button"
          onclick="linkMember()"
        >
          VIEW KNOT PASS
        </button>


        <div
          id="formError"
          class="error"
        ></div>


      </div>


      <div class="venue-line">
        BAR ・ RESTAURANT ・ PARTY
      </div>


      <div class="notice">
        入力情報は会員本人確認のためにのみ使用します。
      </div>

  `;

}



/* =========================================================
   LINK MEMBER
========================================================= */

/**
 * 初回LINE連携
 */
async function linkMember() {

  const memberNo =
    document
      .getElementById('memberNo')
      .value
      .trim();


  const phone =
    document
      .getElementById('phone')
      .value
      .trim();


  const button =
    document
      .getElementById(
        'linkButton'
      );


  const errorBox =
    document
      .getElementById(
        'formError'
      );


  errorBox.style.display =
    'none';


  /*
    validation
  */

  if (!memberNo) {

    showFormError(
      '会員番号を入力してください。'
    );

    return;
  }


  if (!phone) {

    showFormError(
      '電話番号を入力してください。'
    );

    return;
  }


  button.disabled =
    true;


  button.textContent =
    'VERIFYING...';


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'linkMember',

              memberNo:
                memberNo,

              phone:
                phone,

              lineUserId:
                currentLineUserId

            })

        }
      );


    const data =
      await response.json();


    /*
      LINE連携成功
    */
    if (
      data.success &&
      (
        data.status ===
          'LINK_SUCCESS' ||

        data.status ===
          'ALREADY_LINKED'
      )
    ) {

      showMemberCard(
        data.member
      );

      return;
    }


    /*
      認証失敗
    */
    showFormError(
      data.message ||
      '会員情報を確認できませんでした。'
    );


  } catch (error) {

    console.error(
      'LINK MEMBER ERROR',
      error
    );


    showFormError(
      '通信エラーが発生しました。もう一度お試しください。'
    );


  } finally {

    const currentButton =
      document
        .getElementById(
          'linkButton'
        );


    if (currentButton) {

      currentButton.disabled =
        false;


      currentButton.textContent =
        'VIEW KNOT PASS';

    }

  }

}

/* =========================================================
   JOIN MONTH FORMAT
========================================================= */

/**
 * 入会月表示
 */
function formatJoinMonth(value) {

  if (!value) {

    return '-';

  }


  const text =
    String(value).trim();


  /*
    例:
    2026年9月
    ↓
    2026.09
  */

  const match =
    text.match(
      /(\d{4})年\s*(\d{1,2})月/
    );


  if (match) {

    return (
      match[1] +
      '.' +
      String(
        match[2]
      ).padStart(
        2,
        '0'
      )
    );

  }


  return text;

}



/* =========================================================
   HTML ESCAPE
========================================================= */

/**
 * XSS対策
 */
function escapeHtml(value) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111a2d"
  >

  <title>
    WindsorKnot | Member Registration
  </title>


  <style>

    /* =====================================================
       DESIGN TOKENS
    ===================================================== */

    :root {

      --navy:
        #111a2d;

      --navy-deep:
        #0b1220;

      --navy-soft:
        #172238;

      --gold:
        #c6a15b;

      --gold-light:
        #ddc58f;

      --ivory:
        #f4f0e7;

      --danger:
        #e0aaa0;

      --serif:
        "Times New Roman",
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        serif;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Arial,
        sans-serif;

    }



    /* =====================================================
       RESET
    ===================================================== */

    * {

      box-sizing:
        border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html {

      margin:
        0;

      padding:
        0;

      min-height:
        100%;

      background:
        var(--navy);

    }


    body {

      margin:
        0;

      min-height:
        100vh;

      min-height:
        100dvh;

      color:
        var(--ivory);

      font-family:
        var(--sans);

      -webkit-font-smoothing:
        antialiased;

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(198,161,91,.10),
          transparent 35%
        ),

        linear-gradient(
          180deg,
          #141e33 0%,
          #111a2d 48%,
          #0b1322 100%
        );

    }


    body::before {

      content:
        "";

      position:
        fixed;

      z-index:
        0;

      width:
        470px;

      height:
        470px;

      top:
        -285px;

      right:
        -280px;

      border:
        1px solid
        rgba(198,161,91,.10);

      border-radius:
        50%;

      pointer-events:
        none;

    }


    body::after {

      content:
        "";

      position:
        fixed;

      z-index:
        0;

      width:
        350px;

      height:
        350px;

      left:
        -240px;

      bottom:
        -240px;

      border:
        1px solid
        rgba(198,161,91,.07);

      border-radius:
        50%;

      pointer-events:
        none;

    }


    button,
    input {

      font-family:
        inherit;

    }



    /* =====================================================
       PAGE
    ===================================================== */

    .page {

      position:
        relative;

      z-index:
        1;

      width:
        100%;

      min-height:
        100vh;

      min-height:
        100dvh;

    }


    .container {

      width:
        100%;

      max-width:
        480px;

      margin:
        0 auto;

      padding:

        calc(
          26px +
          env(safe-area-inset-top)
        )

        20px

        calc(
          55px +
          env(safe-area-inset-bottom)
        );

    }



    /* =====================================================
       BRAND
    ===================================================== */

    .brand {

      padding-top:
        14px;

      margin-bottom:
        33px;

      text-align:
        center;

    }


    .brand-logo {

      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size:
        clamp(
          38px,
          10vw,
          49px
        );

      font-weight:
        400;

      font-style:
        italic;

      letter-spacing:
        -2.5px;

      line-height:
        1;

    }


    .brand-sub {

      margin-top:
        13px;

      color:
        var(--gold-light);

      font-family:
        var(--serif);

      font-size:
        9px;

      letter-spacing:
        5px;

      opacity:
        .88;

    }


    .brand-line {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        180px;

      margin:
        21px auto 0;

    }


    .brand-line::before,
    .brand-line::after {

      content:
        "";

      display:
        block;

      flex:
        1;

      height:
        1px;

    }


    .brand-line::before {

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(198,161,91,.72)
        );

    }


    .brand-line::after {

      background:
        linear-gradient(
          90deg,
          rgba(198,161,91,.72),
          transparent
        );

    }


    .brand-diamond {

      width:
        5px;

      height:
        5px;

      margin:
        0 11px;

      border:
        1px solid
        var(--gold);

      transform:
        rotate(45deg);

    }



    /* =====================================================
       PANEL
    ===================================================== */

    .panel {

      position:
        relative;

      overflow:
        hidden;

      padding:
        35px 27px 32px;

      border:
        1px solid
        rgba(198,161,91,.25);

      border-radius:
        4px;

      background:

        linear-gradient(
          145deg,
          rgba(23,34,56,.97),
          rgba(10,18,32,.98)
        );

      box-shadow:
        0 28px 65px
        rgba(0,0,0,.24);

    }


    .panel::before {

      content:
        "";

      position:
        absolute;

      inset:
        7px;

      border:
        1px solid
        rgba(198,161,91,.06);

      pointer-events:
        none;

    }


    .panel-content {

      position:
        relative;

      z-index:
        2;

    }



    /* =====================================================
       HEADER
    ===================================================== */

    .eyebrow {

      color:
        var(--gold);

      font-family:
        var(--serif);

      font-size:
        9px;

      letter-spacing:
        3.5px;

    }


    .title {

      margin:
        10px 0 12px;

      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size:
        27px;

      font-weight:
        400;

      letter-spacing:
        .5px;

      line-height:
        1.35;

    }


    .description {

      margin:
        0;

      color:
        rgba(244,240,231,.50);

      font-size:
        11px;

      line-height:
        1.9;

    }


    .ornament {

      display:
        flex;

      align-items:
        center;

      margin:
        28px 0 31px;

    }


    .ornament-line {

      flex:
        1;

      height:
        1px;

      background:

        linear-gradient(
          90deg,
          rgba(198,161,91,.48),
          rgba(198,161,91,.07)
        );

    }


    .ornament-diamond {

      width:
        5px;

      height:
        5px;

      margin-left:
        8px;

      border:
        1px solid
        rgba(198,161,91,.72);

      transform:
        rotate(45deg);

    }



    /* =====================================================
       FORM
    ===================================================== */

    .field {

      margin-bottom:
        24px;

    }


    .field-number {

      display:
        inline-block;

      min-width:
        27px;

      color:
        rgba(198,161,91,.38);

      font-family:
        var(--serif);

      font-size:
        8px;

      letter-spacing:
        1px;

    }


    .label {

      display:
        block;

      margin-bottom:
        9px;

      color:
        rgba(221,197,143,.82);

      font-size:
        9px;

      letter-spacing:
        2.2px;

    }


    .label-jp {

      margin-left:
        5px;

      color:
        rgba(244,240,231,.35);

      font-size:
        9px;

      letter-spacing:
        0;

    }


    input {

      width:
        100%;

      height:
        56px;

      padding:
        0 16px;

      border:
        1px solid
        rgba(198,161,91,.23);

      border-radius:
        2px;

      outline:
        none;

      background:
        rgba(255,255,255,.03);

      color:
        var(--ivory);

      font-size:
        16px;

      transition:
        border-color .2s ease,
        background .2s ease;

    }


    input::placeholder {

      color:
        rgba(244,240,231,.20);

    }


    input:focus {

      border-color:
        rgba(198,161,91,.75);

      background:
        rgba(255,255,255,.045);

    }



    /* =====================================================
       BUTTON
    ===================================================== */

    .submit-area {

      margin-top:
        34px;

    }


    .submit-button {

      position:
        relative;

      width:
        100%;

      min-height:
        61px;

      padding:
        12px 18px;

      border:
        1px solid
        var(--gold);

      border-radius:
        2px;

      background:
        var(--gold);

      color:
        var(--navy-deep);

      font-family:
        var(--serif);

      font-size:
        13px;

      font-weight:
        600;

      letter-spacing:
        2.5px;

      cursor:
        pointer;

      transition:
        opacity .2s ease;

    }


    .submit-button:disabled {

      opacity:
        .45;

      cursor:
        default;

    }


    .submit-sub {

      display:
        block;

      margin-top:
        5px;

      font-family:
        var(--sans);

      font-size:
        8px;

      font-weight:
        400;

      letter-spacing:
        1px;

      opacity:
        .65;

    }



    /* =====================================================
       ERROR
    ===================================================== */

    .error {

      display:
        none;

      margin-top:
        20px;

      padding:
        15px 16px;

      border:
        1px solid
        rgba(193,112,91,.32);

      background:
        rgba(121,47,35,.13);

      color:
        var(--danger);

      font-size:
        11px;

      line-height:
        1.8;

    }



    /* =====================================================
       SUCCESS
    ===================================================== */

    .success {

      text-align:
        center;

      padding:
        15px 0 5px;

    }


    .success-mark {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        68px;

      height:
        68px;

      margin:
        5px auto 30px;

      border:
        1px solid
        var(--gold);

      border-radius:
        50%;

      color:
        var(--gold);

      font-family:
        var(--serif);

      font-size:
        25px;

    }


    .success-eyebrow {

      color:
        var(--gold);

      font-family:
        var(--serif);

      font-size:
        9px;

      letter-spacing:
        3.5px;

    }


    .success-title {

      margin-top:
        10px;

      font-family:
        var(--serif);

      font-size:
        27px;

      line-height:
        1.4;

      letter-spacing:
        .5px;

    }


    .success-description {

      margin-top:
        17px;

      color:
        rgba(244,240,231,.48);

      font-size:
        11px;

      line-height:
        1.9;

    }


    .member-number-box {

      margin:
        31px 0;

      padding:
        24px 15px;

      border-top:
        1px solid
        rgba(198,161,91,.22);

      border-bottom:
        1px solid
        rgba(198,161,91,.22);

    }


    .member-number-label {

      color:
        rgba(221,197,143,.50);

      font-size:
        8px;

      letter-spacing:
        3px;

    }


    .member-number {

      margin-top:
        10px;

      color:
        var(--ivory);

      font-family:
        var(--serif);

      font-size:
        37px;

      letter-spacing:
        3px;

    }


    .important {

      margin-top:
        19px;

      padding:
        15px;

      border:
        1px solid
        rgba(198,161,91,.15);

      background:
        rgba(198,161,91,.04);

      color:
        rgba(244,240,231,.52);

      font-size:
        10px;

      line-height:
        1.8;

    }



    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {

      margin-top:
        25px;

      text-align:
        center;

    }


    .venue-line {

      color:
        rgba(221,197,143,.52);

      font-family:
        var(--serif);

      font-size:
        8px;

      letter-spacing:
        5px;

    }


    .notice {

      margin-top:
        15px;

      color:
        rgba(244,240,231,.27);

      font-size:
        8px;

      line-height:
        1.8;

    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (
      max-width: 370px
    ) {

      .container {

        padding-left:
          15px;

        padding-right:
          15px;

      }


      .panel {

        padding-left:
          22px;

        padding-right:
          22px;

      }


      .title {

        font-size:
          25px;

      }

    }

  </style>

</head>


<body>


<div class="page">


  <div class="container">


    <!-- ==========================================
         BRAND
    =========================================== -->

    <header class="brand">


      <div class="brand-logo">

        WindsorKnot

      </div>


      <div class="brand-sub">

        MEMBERSHIP

      </div>


      <div class="brand-line">

        <div
          class="brand-diamond"
        ></div>

      </div>


    </header>



    <!-- ==========================================
         APPLICATION
    =========================================== -->

    <main id="app">


      <div class="panel">


        <div class="panel-content">


          <div class="eyebrow">

            MEMBER REGISTRATION

          </div>


          <h1 class="title">

            Join WindsorKnot.

          </h1>


          <p class="description">

            WindsorKnotへようこそ。

            <br>

            メンバー登録に必要な情報を
            ご入力ください。

          </p>



          <div class="ornament">

            <div
              class="ornament-line"
            ></div>

            <div
              class="ornament-diamond"
            ></div>

          </div>



          <!-- NAME -->

          <div class="field">


            <label
              class="label"
              for="name"
            >

              <span class="field-number">
                01
              </span>

              YOUR NAME

              <span class="label-jp">
                氏名
              </span>

            </label>


            <input
              id="name"
              type="text"
              autocomplete="name"
              placeholder="宮﨑 航平"
            >


          </div>



          <!-- ORGANIZATION -->

          <div class="field">


            <label
              class="label"
              for="organization"
            >

              <span class="field-number">
                02
              </span>

              AFFILIATION

              <span class="label-jp">
                所属
              </span>

            </label>


            <input
              id="organization"
              type="text"
              autocomplete="organization"
              placeholder="株式会社○○"
            >


          </div>



          <!-- AGE -->

          <div class="field">


            <label
              class="label"
              for="age"
            >

              <span class="field-number">
                03
              </span>

              AGE

              <span class="label-jp">
                年齢
              </span>

            </label>


            <input
              id="age"
              type="number"
              inputmode="numeric"
              min="1"
              max="120"
              placeholder="30"
            >


          </div>



          <!-- PHONE -->

          <div class="field">


            <label
              class="label"
              for="phone"
            >

              <span class="field-number">
                04
              </span>

              PHONE

              <span class="label-jp">
                電話番号
              </span>

            </label>


            <input
              id="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="08012345678"
            >


          </div>



          <!-- EMAIL -->

          <div class="field">


            <label
              class="label"
              for="email"
            >

              <span class="field-number">
                05
              </span>

              EMAIL

              <span class="label-jp">
                メールアドレス
              </span>

            </label>


            <input
              id="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              autocapitalize="none"
              placeholder="example@gmail.com"
            >


          </div>



          <!-- SUBMIT -->

          <div class="submit-area">


            <button
              id="submitButton"
              type="button"
              class="submit-button"
              onclick="registerMember()"
            >

              JOIN WINDSOR KNOT

              <span class="submit-sub">
                会員登録する
              </span>

            </button>


          </div>



          <div
            id="errorBox"
            class="error"
          ></div>


        </div>


      </div>


    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="footer">


      <div class="venue-line">

        BAR ・ RESTAURANT ・ PARTY

      </div>


      <div class="notice">

        ご入力いただいた情報は
        WindsorKnotの会員管理のために使用します。

      </div>


    </footer>


  </div>


</div>



<script>


/* =====================================================
   CONFIG
===================================================== */


/**
 * 既存KNOT PASSと同じGAS
 */
const API_URL =
  'https://script.google.com/macros/s/AKfycbzxcn3Esc_HHA_N13EDRoSeX4ItMobH6eaQ_874g1AV_I0CU6LUaczHbnP_6mDzf6mNCw/exec';


/**
 * KNOT PASS
 */
const KNOT_PASS_URL =
  'https://liff.line.me/2011750249-fEwnWrPD';



/* =====================================================
   STATE
===================================================== */


let isSubmitting =
  false;



/* =====================================================
   REGISTER
===================================================== */


async function registerMember() {


  if (
    isSubmitting
  ) {

    return;

  }



  const name =

    document
      .getElementById(
        'name'
      )
      .value
      .trim();


  const organization =

    document
      .getElementById(
        'organization'
      )
      .value
      .trim();


  const age =

    document
      .getElementById(
        'age'
      )
      .value
      .trim();


  const phone =

    document
      .getElementById(
        'phone'
      )
      .value
      .trim();


  const email =

    document
      .getElementById(
        'email'
      )
      .value
      .trim();



  /**
   * ==========================================
   * VALIDATION
   * ==========================================
   */


  hideError();



  if (!name) {

    showError(
      '氏名を入力してください。'
    );

    return;

  }


  if (!organization) {

    showError(
      '所属を入力してください。'
    );

    return;

  }


  if (!age) {

    showError(
      '年齢を入力してください。'
    );

    return;

  }


  const ageNumber =
    Number(age);


  if (
    !Number.isInteger(
      ageNumber
    ) ||
    ageNumber < 1 ||
    ageNumber > 120
  ) {

    showError(
      '年齢を正しく入力してください。'
    );

    return;

  }


  const normalizedPhone =

    phone.replace(
      /[^0-9０-９]/g,
      ''
    );


  if (!normalizedPhone) {

    showError(
      '電話番号を入力してください。'
    );

    return;

  }


  if (
    normalizedPhone.length < 10 ||
    normalizedPhone.length > 11
  ) {

    showError(
      '電話番号を正しく入力してください。'
    );

    return;

  }


  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


  if (
    !email ||
    !emailPattern.test(
      email
    )
  ) {

    showError(
      'メールアドレスを正しく入力してください。'
    );

    return;

  }



  /**
   * ==========================================
   * BUTTON
   * ==========================================
   */


  const button =

    document
      .getElementById(
        'submitButton'
      );


  isSubmitting =
    true;


  button.disabled =
    true;


  button.innerHTML = `

    REGISTERING...

    <span class="submit-sub">

      登録しています

    </span>

  `;



  /**
   * ==========================================
   * API
   * ==========================================
   */


  try {


    const response =

      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:

            JSON.stringify({

              action:
                'registerMember',

              name:
                name,

              organization:
                organization,

              age:
                ageNumber,

              phone:
                phone,

              email:
                email

            })

        }

      );



    if (!response.ok) {

      throw new Error(
        '登録処理に失敗しました。'
      );

    }



    const data =
      await response.json();



    /**
     * ==========================================
     * SUCCESS
     * ==========================================
     */


    if (
      data.success &&
      data.status ===
        'MEMBER_REGISTERED'
    ) {


      showSuccess(
        data.member
      );


      return;

    }



    /**
     * ==========================================
     * API ERROR
     * ==========================================
     */


    throw new Error(

      data.message ||

      '会員登録に失敗しました。'

    );


  } catch (error) {


    console.error(
      'REGISTER ERROR',
      error
    );


    showError(

      error.message ||

      '通信エラーが発生しました。もう一度お試しください。'

    );


    isSubmitting =
      false;


    button.disabled =
      false;


    button.innerHTML = `

      JOIN WINDSOR KNOT

      <span class="submit-sub">

        会員登録する

      </span>

    `;

  }

}



/* =====================================================
   SUCCESS
===================================================== */


function showSuccess(
  member
) {


  const memberNo =

    escapeHtml(

      member &&
      member.memberNo

        ? member.memberNo

        : ''

    );


  const name =

    escapeHtml(

      member &&
      member.name

        ? member.name

        : ''

    );


  document
    .getElementById(
      'app'
    )
    .innerHTML = `


      <div class="panel">


        <div class="panel-content">


          <div class="success">


            <div class="success-mark">

              ✓

            </div>


            <div class="success-eyebrow">

              MEMBERSHIP REGISTERED

            </div>


            <div class="success-title">

              WELCOME TO
              <br>
              WINDSOR KNOT.

            </div>


            <div class="success-description">

              ${name} 様

              <br>

              会員登録が完了しました。

            </div>



            <div class="member-number-box">


              <div class="member-number-label">

                YOUR MEMBER No.

              </div>


              <div class="member-number">

                ${memberNo}

              </div>


            </div>



            <div class="important">

              会員番号はKNOT PASSとの
              初回連携時に使用します。

              <br>

              この番号をお控えください。

            </div>



            <div
              style="
                margin-top:28px;
              "
            >


              <button
                type="button"
                class="submit-button"
                onclick="openKnotPass()"
              >

                OPEN KNOT PASS

                <span class="submit-sub">

                  会員証を開く

                </span>

              </button>


            </div>


          </div>


        </div>


      </div>

  `;


  window.scrollTo({

    top:
      0,

    behavior:
      'smooth'

  });

}



/* =====================================================
   OPEN KNOT PASS
===================================================== */


function openKnotPass() {


  window.location.href =
    KNOT_PASS_URL;

}



/* =====================================================
   ERROR
===================================================== */


function showError(
  message
) {


  const box =

    document
      .getElementById(
        'errorBox'
      );


  if (!box) {

    return;

  }


  box.textContent =
    message;


  box.style.display =
    'block';


  box.scrollIntoView({

    behavior:
      'smooth',

    block:
      'center'

  });

}



function hideError() {


  const box =

    document
      .getElementById(
        'errorBox'
      );


  if (!box) {

    return;

  }


  box.style.display =
    'none';


  box.textContent =
    '';

}



/* =====================================================
   ESCAPE HTML
===================================================== */


function escapeHtml(
  value
) {


  return String(

    value == null

      ? ''

      : value

  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}
